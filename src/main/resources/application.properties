spring.application.name=SpringBatchExerciceKotlin

# H2 en memoire : stocke les tables techniques BATCH_* du JobRepository
#spring.datasource.url=jdbc:h2:mem:batchdb;DB_CLOSE_DELAY=-1
#Dans un fichier
spring.datasource.url=jdbc:h2:file:./testdb;AUTO_SERVER=true
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

#Console accessible http://localhost:8080/h2-console et mettre l'URL choisi dans datasource.url
spring.h2.console.enabled=true

# Cree automatiquement le schema BATCH_* pour une base embarquee (H2)
spring.batch.jdbc.initialize-schema=always

# Ne pas lancer les jobs au demarrage : on les declenchera nous-memes
spring.batch.job.enabled=false
