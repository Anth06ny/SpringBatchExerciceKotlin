# Config dediee aux tests : H2 en MEMOIRE (le testdb fichier des manips manuelles
# ne doit pas polluer les assertions sur les executions)
spring.datasource.url=jdbc:h2:mem:batchtest;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Cree le schema BATCH_* au demarrage du contexte de test
spring.batch.jdbc.initialize-schema=always

# JPA/Hibernate (TP4) : cree la table VENTE dans la base H2 en memoire des tests.
# (ce fichier de test masque entierement le application.properties principal)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Ne pas lancer les jobs au demarrage : chaque test lance le sien
spring.batch.job.enabled=false
